<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and streaming animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }
    @keyframes dashStream1 {
      to { stroke-dashoffset: -120; }
    }
    @keyframes dashStream2 {
      to { stroke-dashoffset: 120; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
      50% { transform: translateY(-10px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(0.9); opacity: 0.3; }
    }
    .grid-lines { stroke: #1e293b; stroke-width: 0.8; opacity: 0.4; }
    .stream-fast {
      stroke-dasharray: 8, 12;
      animation: dashStream1 3s linear infinite;
    }
    .stream-reverse {
      stroke-dasharray: 6, 10;
      animation: dashStream2 4s linear infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Background Tech Grid Lines (Behind Content) -->
  <g class="grid-lines">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Light Orbs (Behind Content) -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="170" fill="#7c3aed" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Network Routing & Multipath Topology Lines (Background Flow) -->
  <g opacity="0.65">
    <!-- WAN 1: Fiber link path -->
    <path d="M 60 70 Q 300 20, 600 70 T 1140 70" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-fast" />
    <!-- WAN 2: 5G / Cellular path -->
    <path d="M 60 290 Q 350 340, 600 290 T 1140 290" fill="none" stroke="#a855f7" stroke-width="2.5" class="stream-reverse" />
    <!-- Aggregation Core Conduits -->
    <path d="M 60 70 C 250 140, 350 180, 600 180 C 850 180, 950 140, 1140 70" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4, 8" opacity="0.4" />
    <path d="M 60 290 C 250 220, 350 180, 600 180 C 850 180, 950 220, 1140 290" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="4, 8" opacity="0.4" />
  </g>

  <!-- Dynamic Floating Interface Nodes & Packets (Side Decorative) -->
  <g class="particle" style="animation-delay: 0s;">
    <circle cx="120" cy="70" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="120" cy="70" r="14" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" />
    <text x="140" y="74" fill="#94a3b8" font-size="11" font-weight="600">WAN-1 (Fiber)</text>
  </g>

  <g class="particle" style="animation-delay: 1.5s;">
    <circle cx="120" cy="290" r="6" fill="#a855f7" filter="url(#glow)" />
    <circle cx="120" cy="290" r="14" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.5" />
    <text x="140" y="294" fill="#94a3b8" font-size="11" font-weight="600">WAN-2 (5G/LTE)</text>
  </g>

  <g class="particle" style="animation-delay: 0.8s;">
    <circle cx="1060" cy="70" r="6" fill="#34d399" filter="url(#glow)" />
    <circle cx="1060" cy="70" r="14" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.5" />
    <text x="960" y="74" fill="#94a3b8" font-size="11" font-weight="600">BONDED (10Gbps)</text>
  </g>

  <g class="particle" style="animation-delay: 2.2s;">
    <circle cx="1060" cy="290" r="6" fill="#f43f5e" filter="url(#glow)" />
    <circle cx="1060" cy="290" r="14" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.5" />
    <text x="965" y="294" fill="#94a3b8" font-size="11" font-weight="600">SD-WAN OVERLAY</text>
  </g>

  <!-- Central Foreground Content Card (Solid high-contrast container so title & subtitle NEVER get hidden) -->
  <g transform="translate(200, 75)">
    <rect width="800" height="210" rx="18" fill="#090d1a" fill-opacity="0.94" stroke="#334155" stroke-width="1.5" />
    <rect width="796" height="206" x="2" y="2" rx="16" fill="none" stroke="url(#cyanPurple)" stroke-width="1" opacity="0.4" />

    <!-- Badge Pills -->
    <g transform="translate(140, 32)">
      <rect width="145" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="72" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ TRAFFIC BONDING</text>
    </g>
    <g transform="translate(295, 32)">
      <rect width="130" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="65" y="17" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">🌐 SD-WAN & SASE</text>
    </g>
    <g transform="translate(435, 32)">
      <rect width="145" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="72" y="17" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">🚀 MULTI-PATH ROUTING</text>
    </g>

    <!-- Main Title -->
    <text x="400" y="105" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="-0.5">
      Network Routing &amp; Traffic Aggregation
    </text>

    <!-- Subtitle -->
    <text x="400" y="142" text-anchor="middle" fill="url(#cyanPurple)" font-size="16" font-weight="600" letter-spacing="0.5">
      Curated Directory of Enterprise SaaS Solutions &amp; Open-Source Projects
    </text>

    <!-- Capabilities / Tech Specs Bar -->
    <text x="400" y="178" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">
      Multi-WAN Bonding • Kernel-Bypass DPDK • MPTCP • Zero-Trust Overlays • Smart Link Balancing
    </text>
  </g>
</svg>
