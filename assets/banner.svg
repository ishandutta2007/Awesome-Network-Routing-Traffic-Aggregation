<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Tech Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1040" cy="180" r="150" fill="#7c3aed" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Animated Multipath Routing Topology Waves (SMIL animation) -->
  <g opacity="0.45">
    <path d="M 0,90 Q 300,30 600,90 T 1200,90" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10, 14">
      <animate attributeName="stroke-dashoffset" values="0;-240" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 0,270 Q 350,330 600,270 T 1200,270" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="8, 12">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M 0,180 Q 400,100 800,220 T 1200,180" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="6, 10" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Node Pulses on Edges -->
  <g transform="translate(110, 90)">
    <circle r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="8;24;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <g transform="translate(110, 270)">
    <circle r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="8;24;8" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#a855f7" filter="url(#glow)" />
  </g>

  <g transform="translate(1090, 90)">
    <circle r="18" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="8;24;8" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#10b981" filter="url(#glow)" />
  </g>

  <g transform="translate(1090, 270)">
    <circle r="18" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="8;24;8" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Foreground Content Container (Card Frame) -->
  <g transform="translate(140, 45)">
    <!-- Container Card -->
    <rect width="920" height="270" rx="18" fill="#090d1a" fill-opacity="0.92" stroke="#334155" stroke-width="1.5" />
    <rect width="916" height="266" x="2" y="2" rx="16" fill="none" stroke="url(#cyanPurple)" stroke-width="1" opacity="0.35" />

    <!-- Badges Row -->
    <g transform="translate(160, 32)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="90" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ TRAFFIC BONDING</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="90" y="18" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">🌐 SD-WAN &amp; SASE</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text x="105" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">🚀 MULTI-PATH ROUTING</text>
      </g>
    </g>

    <!-- Main Title -->
    <text x="460" y="125" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Network Routing &amp; Traffic Aggregation
    </text>

    <!-- Subtitle -->
    <text x="460" y="168" text-anchor="middle" fill="url(#cyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.4">
      Curated Directory of Enterprise SaaS Solutions &amp; Open-Source Projects
    </text>

    <!-- Capabilities / Tech Specs Tags -->
    <g transform="translate(70, 205)">
      <!-- Feature Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="90" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📡 Multi-WAN Bonding</text>
      </g>
      <!-- Feature Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="185" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="92" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Kernel-Bypass DPDK</text>
      </g>
      <!-- Feature Pill 3 -->
      <g transform="translate(395, 0)">
        <rect width="185" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="92" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 Zero-Trust Overlays</text>
      </g>
      <!-- Feature Pill 4 -->
      <g transform="translate(595, 0)">
        <rect width="185" height="30" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
        <text x="92" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔀 Smart Link Balancing</text>
      </g>
    </g>
  </g>
</svg>
